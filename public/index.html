<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jarvis</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="stage">
    <p class="brand">JARVIS</p>
    <button id="orbBtn" class="orb idle" type="button" aria-label="Activar o pausar micrófono"></button>
    <p id="stateLine" class="state">Iniciando...</p>
    <p id="heardLine" class="heard" hidden></p>
    <p class="hint">Prueba: <em>briefing</em> · <em>modo enfoque</em> · <em>modo mañana</em> · <em>resume el portapapeles</em></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
